<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="/js/theme.js?v=20260928_2200"></script>

  <style id="anti-google-banner">
    /* Targeted suppression of Google Translate top banner, toolbar, and balloon popups */
    iframe.goog-te-banner-frame,
    iframe[class*="VIpgJd"],
    iframe[id*=":1.container"],
    iframe[id*=":2.container"],
    iframe[id*="container"],
    iframe[src*="translate.google"],
    .goog-te-banner-frame,
    .goog-te-balloon-frame,
    div.VIpgJd-ZVi9od-ORHb-OEVmcd,
    div.VIpgJd-ZVi9od-aZ2wEe-wOHMyf,
    div.VIpgJd-suEOdc,
    div.VIpgJd-yAWNEb-L7lbkb,
    div[class*="VIpgJd-ZVi9od"],
    div[class*="VIpgJd-suEOdc"],
    [class*="goog-te-banner"],
    [id*="goog-gt-"],
    .goog-tooltip,
    .goog-te-spinner-pos,
    #google_translate_element {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      height: 0px !important;
      max-height: 0px !important;
      width: 0px !important;
      max-width: 0px !important;
      position: fixed !important;
      top: -99999px !important;
      left: -99999px !important;
      z-index: -999999 !important;
      clip: rect(0, 0, 0, 0) !important;
      transform: scale(0) !important;
      overflow: hidden !important;
      margin: 0px !important;
      padding: 0px !important;
    }

    /* Translated text nodes and fonts MUST ALWAYS REMAIN FULLY VISIBLE & INLINE */
    font,
    font[class],
    font[class*="VIpgJd"],
    .VIpgJd-yAWNEb-VIpgJd-fmcmS-sn54Q,
    [class*="VIpgJd-yAWNEb-VIpgJd-fmcmS-sn54Q"],
    .goog-text-highlight {
      display: inline !important;
      visibility: visible !important;
      opacity: 1 !important;
      pointer-events: inherit !important;
      height: auto !important;
      width: auto !important;
      max-height: none !important;
      max-width: none !important;
      position: static !important;
      top: auto !important;
      left: auto !important;
      clip: auto !important;
      transform: none !important;
      overflow: visible !important;
      margin: 0 !important;
      padding: 0 !important;
      background: transparent !important;
      background-color: transparent !important;
      box-shadow: none !important;
      border: none !important;
    }

    html,
    body,
    body.translated-ltr,
    body.translated-rtl {
      top: 0px !important;
      position: static !important;
      margin-top: 0px !important;
      padding-top: 0px !important;
      transform: none !important;
    }
  </style>
</head>
<body>

  <!-- ==================== HEADER ==================== -->
  <header class="app-header">
    <div class="brand-badge">
      <div class="brand-icon">
        <svg style="width:24px;height:24px;color:#fff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.5m-15 10.5V10.5" />
        </svg>
      </div>
      <div>
        <div style="display:flex;align-items:center;gap:0.5rem">
          <span class="brand-title">NeoBank</span>
          <span style="font-size:0.65rem;font-weight:700;padding:0.15rem 0.5rem;border-radius:9999px;background:rgba(99,102,241,0.15);color:#a5b4fc;border:1px solid rgba(99,102,241,0.3)">2026</span>
        </div>
        <div data-i18n="brand_sub" style="font-size:0.75rem;color:var(--text-muted)">Digital Banking</div>
      </div>
    </div>

    <!-- Right Controls: Theme, Language Selector & Navigation -->
    <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap">
      <!-- Dark / Light Theme Toggle Switch -->
      <button type="button" class="theme-toggle-btn" onclick="toggleAppTheme()" aria-label="Toggle light and dark theme" title="Toggle Light/Dark Theme">
        <span class="theme-toggle-track">
          <span class="theme-toggle-indicator">
            <svg class="theme-toggle-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="m4.93 4.93 1.41 1.41"></path>
              <path d="m17.66 17.66 1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="m6.34 17.66-1.41 1.41"></path>
              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
            <svg class="theme-toggle-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
            </svg>
          </span>
        </span>
        <span class="theme-toggle-label">Dark</span>
      </button>

      <!-- Accessibility Page Zoom Controls: Minus / Reset / Plus -->
      <div class="page-zoom-controls">
        <button type="button" class="zoom-btn zoom-out-btn" onclick="zoomPageOut()" title="Zoom Out (Smaller Text -)" aria-label="Zoom out">
          −
        </button>
        <button type="button" class="zoom-btn zoom-reset-btn" onclick="resetPageZoom()" title="Reset Page Size (100%)" aria-label="Reset zoom">
          <span class="zoom-level-text">100%</span>
        </button>
        <button type="button" class="zoom-btn zoom-in-btn" onclick="zoomPageIn()" title="Zoom In (Larger Text +)" aria-label="Zoom in">
          +
        </button>
      </div>

      <!-- Language Selector (Protected from Auto-Translation) -->
      <div class="neobank-lang-wrap notranslate" translate="no" style="display:flex;align-items:center;gap:0.4rem;background:rgba(255,255,255,0.05);padding:0.35rem 0.65rem;border-radius:10px;border:1px solid var(--border-subtle)">
        <span style="font-size:0.9rem">🌐</span>
        <select class="neobank-lang-select notranslate form-select" translate="no" style="background:transparent;border:none;color:inherit;font-size:0.8rem;padding:0;cursor:pointer;outline:none" onchange="handleLanguageChange(this)">
          <option value="en" selected class="notranslate" translate="no">🇺🇸 English (EN)</option>
          <option value="es" class="notranslate" translate="no">🇪🇸 Español (ES)</option>
          <option value="fr" class="notranslate" translate="no">🇫🇷 Français (FR)</option>
          <option value="de" class="notranslate" translate="no">🇩🇪 Deutsch (DE)</option>
          <option value="hi" class="notranslate" translate="no">🇮🇳 हिन्दी (HI)</option>
          <option value="ar" class="notranslate" translate="no">🇸🇦 العربية (AR)</option>
          <option value="zh-CN" class="notranslate" translate="no">🇨🇳 中文 (ZH)</option>
          <option value="ja" class="notranslate" translate="no">🇯🇵 日本語 (JA)</option>
          <option value="ru" class="notranslate" translate="no">🇷🇺 Русский (RU)</option>
          <option value="pt" class="notranslate" translate="no">🇵🇹 Português (PT)</option>
          <option value="it" class="notranslate" translate="no">🇮🇹 Italiano (IT)</option>
          <option value="ko" class="notranslate" translate="no">🇰🇷 한국어 (KO)</option>
          <option value="tr" class="notranslate" translate="no">🇹🇷 Türkçe (TR)</option>
          <option value="nl" class="notranslate" translate="no">🇳🇱 Nederlands (NL)</option>
          <option value="bn" class="notranslate" translate="no">🇧🇩 বাংলা (BN)</option>
          <option value="ta" class="notranslate" translate="no">🇮🇳 தமிழ் (TA)</option>
          <option value="te" class="notranslate" translate="no">🇮🇳 తెలుగు (TE)</option>
        </select>
      </div>

      <a href="/" class="btn btn-outline btn-sm">
        <span>Home</span>
      </a>
      <a href="/login" class="btn btn-outline btn-sm">
        <span data-i18n="return_login">Sign In</span>
      </a>
    </div>
  </header>

  <!-- ==================== TRACKING CONTAINER ==================== -->
  <main style="display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 80px);padding:1.5rem">
    <div class="glass-card" style="width:100%;max-width:540px;padding:2.25rem">
      <div style="text-align:center;margin-bottom:1.5rem">
        <h2 data-i18n="track_title" style="font-size:1.6rem;font-weight:800;color:var(--text-main)">Track Account Opening Application</h2>
        <p data-i18n="track_subtitle" style="font-size:0.85rem;color:var(--text-secondary);margin-top:0.35rem">
          Enter your official Application Reference Number to check underwriting progress and provisioning status.
        </p>
      </div>

      <form id="form-track-app" onsubmit="event.preventDefault(); handleTrackingLookup(this);">
        <div class="form-group">
          <label data-i18n="app_num_label" class="form-label">Application Reference Number</label>
          <input type="text" name="appNumber" class="form-input" data-i18n-placeholder="app_num_placeholder" placeholder="e.g. APP-2026-891042" style="font-family:monospace;letter-spacing:0.05em;font-size:1rem" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:0.75rem">
          <span data-i18n="track_lookup_btn">Lookup Application Status</span>
        </button>
      </form>

      <!-- Dynamic Tracking Result Box -->
      <div id="tracking-result-box" style="display:none;margin-top:1.5rem"></div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:2rem;padding-top:1.25rem;border-top:1px solid var(--border-subtle);font-size:0.85rem">
        <a href="/open_account_customer" style="color:var(--emerald-400);text-decoration:underline">
          <span data-i18n="open_account_btn">Open New Bank Account</span>
        </a>
        <a href="/login" style="color:var(--text-secondary);text-decoration:underline">
          <span data-i18n="return_login">Return to Sign In</span>
        </a>
      </div>
    </div>
  </main>

  <!-- Core Scripts -->
  <script src="/js/api.js?v=20260928_2200"></script>
  <script>
    if (typeof window.formatHumanText !== 'function') {
      window.formatHumanText = function(val) {
        if (!val || typeof val !== 'string') return val || '';
        const trimmed = val.trim();
        if (trimmed.startsWith('http') || trimmed.includes('@') || /^\$?[0-9]/.test(trimmed) || /^[0-9a-f]{8}-[0-9a-f]{4}/i.test(trimmed)) return val;
        if (trimmed.includes('_') || (/^[A-Z0-9_]{3,}$/.test(trimmed) && trimmed === trimmed.toUpperCase())) {
          return trimmed.split('_').filter(Boolean).map(part => {
            const upper = part.toUpperCase();
            if (['ID', 'KYC', 'OTP', 'APY', 'NRI', 'ATM', 'USD', 'EUR', 'GBP'].includes(upper)) return upper;
            return part.charAt(0).toUpperCase() + part.slice(1).toLowerCase();
          }).join(' ');
        }
        return val;
      };
    }
    var formatHumanText = window.formatHumanText;

    async function handleTrackingLookup(form) {
      const appNum = form.appNumber.value.trim().toUpperCase();
      const resultBox = document.getElementById('tracking-result-box');
      resultBox.style.display = 'block';
      resultBox.innerHTML = '<div style="text-align:center;padding:1.5rem;color:var(--text-secondary)">Looking up application in core banking ledger...</div>';

      try {
        const app = await api(`/onboarding/track/${encodeURIComponent(appNum)}`);
        const statusClass = (app.status || '').toLowerCase().replace('_', '-');

        resultBox.innerHTML = `
          <div style="background:rgba(255,255,255,0.03);border:1px solid var(--border-subtle);border-radius:14px;padding:1.25rem">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem">
              <span style="font-family:monospace;font-weight:800;color:var(--brand-500);font-size:1.1rem">${app.applicationNumber}</span>
              <span class="status-pill ${statusClass}">${app.status === 'DRAFT_INITIATED' ? 'Draft Created' : app.status === 'DRAFT_SAVED' ? 'Draft Saved' : formatHumanText(app.status)}</span>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;font-size:0.8rem;margin-bottom:1rem">
              <div><span style="color:var(--text-muted)">Applicant:</span> <strong>${app.applicantName || 'Applicant Draft'}</strong></div>
              <div><span style="color:var(--text-muted)">Account Type:</span> <strong>${formatHumanText(app.accountType)}</strong></div>
              <div><span style="color:var(--text-muted)">Branch:</span> <strong>${app.branchName || 'Not Assigned'} ${app.branchCode ? '(' + app.branchCode + ')' : ''}</strong></div>
              <div><span style="color:var(--text-muted)">Created / Saved:</span> <span>${(app.updatedAt || app.submittedAt || '').slice(0, 10) || 'Recent'}</span></div>
            </div>

            ${app.isDraft ? `
              <div style="background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.25);padding:0.85rem;border-radius:10px;text-align:center;margin-bottom:0.75rem">
                <span style="font-size:0.85rem;font-weight:700;color:var(--brand-400)">
                  ${app.status === 'DRAFT_INITIATED' ? '📋 Application Initiated (Incomplete)' : '💾 Application Draft Saved'}
                </span>
                <p style="font-size:0.75rem;color:var(--text-secondary);margin:0.35rem 0 0.6rem">
                  ${app.status === 'DRAFT_INITIATED' ? 'Your Application Number is locked. Complete the uniform bank form to submit your application.' : 'Your entered information is saved. Click below to resume and submit your application.'}
                </p>
                <a href="/open_account_customer?app=${encodeURIComponent(app.applicationNumber)}" class="btn btn-primary btn-sm" style="display:inline-block">
                  📝 Continue / Resume Application
                </a>
              </div>
            ` : ''}

            ${app.generatedAccountNumber ? `
              <div style="background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);padding:0.75rem;border-radius:10px;text-align:center;margin-bottom:0.75rem">
                <span style="font-size:0.75rem;color:var(--emerald-400);text-transform:uppercase;font-weight:700">Official Account Number</span>
                <div style="font-size:1.35rem;font-weight:800;font-family:monospace;color:var(--text-main)">${app.generatedAccountNumber}</div>
                <div style="font-size:0.75rem;color:var(--text-secondary);margin-top:0.25rem">You may now log in directly on the sign-in page.</div>
                <a href="/login" class="btn btn-success btn-sm" style="display:inline-block;margin-top:0.5rem">Sign In to Dashboard</a>
              </div>
            ` : ''}

            ${(app.officerMessages && app.officerMessages.length > 0) ? `
              <div style="margin-top:0.75rem;padding:0.75rem;background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.25);border-radius:10px">
                <div style="font-size:0.78rem;font-weight:700;color:var(--brand-400);margin-bottom:0.4rem;display:flex;align-items:center;gap:0.35rem">
                  <span>💬</span>
                  <span>Messages &amp; Requests from Bank Verifying Officer:</span>
                </div>
                ${app.officerMessages.map(m => `
                  <div style="background:rgba(0,0,0,0.2);padding:0.5rem 0.75rem;border-radius:6px;margin-bottom:0.35rem;font-size:0.75rem">
                    <div style="display:flex;justify-content:space-between;color:var(--text-muted);font-size:0.68rem;margin-bottom:0.2rem">
                      <strong>${m.senderName || 'Verifying Officer'}</strong>
                      <span>${(m.timestamp || '').slice(0, 16).replace('T', ' ')}</span>
                    </div>
                    <div style="color:var(--text-main);line-height:1.4">${m.message}</div>
                  </div>
                `).join('')}
              </div>
            ` : ''}

            ${app.reviewNotes ? `
              <div style="font-size:0.75rem;color:var(--text-secondary);border-top:1px dashed var(--border-subtle);padding-top:0.5rem;margin-top:0.5rem">
                <strong>Officer Notes:</strong> ${app.reviewNotes}
              </div>
            ` : ''}
          </div>
        `;
      } catch (err) {
        resultBox.innerHTML = `
          <div style="background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.3);border-radius:14px;padding:1.5rem;text-align:center">
            <div style="display:inline-flex;align-items:center;gap:0.4rem;background:rgba(239,68,68,0.15);color:var(--rose-500);font-size:0.75rem;font-weight:700;padding:0.25rem 0.75rem;border-radius:9999px;margin-bottom:0.75rem">
              <span>⚠️</span>
              <span>APPLICATION NOT AVAILABLE / NOT FOUND</span>
            </div>
            <h4 style="font-size:1.1rem;font-weight:800;color:var(--text-main);margin-bottom:0.4rem">
              No Application Found for Reference
            </h4>
            <div style="font-family:monospace;font-size:1.1rem;font-weight:700;color:var(--rose-500);background:rgba(0,0,0,0.3);display:inline-block;padding:0.25rem 0.75rem;border-radius:6px;margin-bottom:0.75rem">
              ${escapeHtml(appNum)}
            </div>
            <p style="font-size:0.83rem;color:var(--text-secondary);line-height:1.5;margin-bottom:1.25rem">
              This application reference could not be located in the core banking records. The link may be invalid, or the application might not have been created yet.
            </p>
            <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap">
              <button type="button" class="btn btn-outline btn-sm" onclick="focusAppInput()">
                <span>🔄 Try Another Reference</span>
              </button>
              <a href="/open_account_customer" class="btn btn-primary btn-sm">
                <span>📝 Open New Account</span>
              </a>
            </div>
          </div>
        `;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function focusAppInput() {
      const inp = document.querySelector('input[name="appNumber"]');
      if (inp) {
        inp.value = '';
        inp.focus();
      }
    }

    function detectAndTrackFromUrl() {
      let appNum = '';

      // 1. Check path: /existing_application/app=APP-XXXX or /existing_application/APP-XXXX or /track/APP-XXXX
      const path = window.location.pathname;
      const pathMatch = path.match(/\/(?:existing_application|track)\/([^\/?#]+)/i);
      if (pathMatch && pathMatch[1]) {
        let raw = decodeURIComponent(pathMatch[1]).trim();
        raw = raw.replace(/^app=/i, '').replace(/^id=/i, '').replace(/^application=/i, '');
        if (raw) appNum = raw;
      }

      // 2. Check query params: ?app=... or ?applicationNumber=... or ?id=... or ?ref=...
      if (!appNum) {
        const params = new URLSearchParams(window.location.search);
        let paramVal = params.get('app') || params.get('applicationNumber') || params.get('id') || params.get('ref') || params.get('appNumber');
        if (paramVal) {
          appNum = paramVal.trim().replace(/^app=/i, '');
        }
      }

      if (appNum) {
        appNum = appNum.toUpperCase();
        const form = document.getElementById('form-track-app');
        if (form && form.appNumber) {
          form.appNumber.value = appNum;
          handleTrackingLookup(form);
        }
      }
    }

    document.addEventListener('DOMContentLoaded', detectAndTrackFromUrl);
  </script>
  <script>try{localStorage.setItem('nb_last_page',location.pathname+location.search)}catch(e){}</script>
</body>
</html>
